name: Build Bicep and create Release draft

on:
  push:
    branches: [main]
    paths:
      - 'build/**'
  pull_request:
    branches: [main]
    paths:
      - 'build/**'
  workflow_dispatch:

# on:
#   push:
#     # branches to consider in the event; optional, defaults to all
#     branches:
#       - main
#     # pull_request event is required only for autolabeler
#     pull_request:
#       # Only following types are handled by the action, but one can default to all as well
#       types: [opened, reopened, synchronize]
#     # pull_request_target event is required for autolabeler to support PRs from forks
#     pull_request_target:
#       types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  build-and-attach:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@633666f66e0061ca3b725c73b2ec20cd13a8fdd1 # v2.0.3

      - name: Build workbook by Terraform
        run: make all

      - name: ls
        run: ls -lR

      - name: Upload workbook files
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3.2.1
        with:
          name: asset
          path: |
            build/artifacts/*
          if-no-files-found: error

  update_release_draft:
    permissions:
      contents: write  # for release-drafter/release-drafter to create a github release
      pull-requests: write  # for release-drafter/release-drafter to add label to PR
    runs-on: ubuntu-latest
    if: github.event_name	== 'push'
    needs: build-and-attach
    steps:
      # Drafts your next Release notes as Pull Requests are merged into "master"
      - uses: release-drafter/release-drafter@09c613e259eb8d4e7c81c2cb00618eb5fc4575a7 # v5.25.0
        id: release_drafter
        # (Optional) specify config name to use, relative to .github/. Default: release-drafter.yml
        # with:
        #   config-name: my-config.yml
        #   disable-autolabeler: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate token
        id: generate_token
        uses: tibdex/github-app-token@32691ba7c9e7063bd457bd8f2a5703138591fa58 # v1.9.0
        with:
          app_id: ${{ secrets.FOR_COMMIT_BOT_APP_ID }}
          private_key: ${{ secrets.FOR_COMMIT_BOT_PRIVATE_KEY }}
      # Checkout code
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{steps.generate_token.outputs.token}}
      - name: Download asset
        uses: actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a # v3.0.2
      - name: Display structure of downloaded files
        run: ls -lR
      - uses: shogo82148/actions-upload-release-asset@9ee13965a8a51926f330b424693f25fcff8f2ef6 # v1.10.6
        with:
          upload_url: ${{ steps.release_drafter.outputs.upload_url }}
          asset_path: |
            asset/*.workbook
          overwrite: true
      - name: Move files from asset to workbooks directory
        run: |
          mv -f asset/* workbooks/
      - uses: EndBug/add-and-commit@998652d28d7702d095d40f52ae42982a80ae8c7d # v9.0.1
        with:
          author_name: github-actions
          author_email: '41898282+github-actions[bot]@users.noreply.github.com'
          message: Git push workbook files
          push: origin main --force --set-upstream
          add: |
            workbooks/
